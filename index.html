<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>五十音 (Gojuon) Practice App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>五十音 (Gojuon) Practice</h1>
    
    <!-- Navigation / Mode Selector -->
    <div class="controls">
      <button id="mode-study" class="active">Study Chart</button>
      <button id="mode-quiz">Quiz Mode</button>
      <button id="toggle-kana">Switch to Katakana</button>
    </div>

    <!-- Script Selector for Quiz Mode -->
    <div id="script-selector-container" class="script-selector hidden">
      <label for="script-mode-select"><strong>Quiz Script Mode: </strong></label>
      <select id="script-mode-select">
        <option value="hiragana">Hiragana Only (ひらがな)</option>
        <option value="katakana">Katakana Only (カタカナ)</option>
        <option value="mixed" selected>Mixed Mode (Hiragana + Katakana)</option>
      </select>
    </div>

    <!-- 1. Study Chart View -->
    <div id="chart-view" class="view">
      <div id="gojuon-grid" class="grid"></div>
    </div>

    <!-- 2. Quiz Mode View -->
    <div id="quiz-view" class="view hidden">
      <!-- Row Filter Section -->
      <div class="filter-container">
        <h3>Select Rows to Quiz:</h3>
        <div class="preset-buttons">
          <button id="preset-all" class="small-btn">Select All</button>
          <button id="preset-vowels" class="small-btn">Vowels Only (あ行)</button>
          <button id="preset-clear" class="small-btn">Clear All</button>
        </div>
        <div id="row-checkboxes" class="row-grid"></div>
      </div>

      <!-- Quiz Card Section -->
      <div class="quiz-card">
        <div id="quiz-question" class="question-kana">あ</div>
        <p class="quiz-instruction">Type the Romaji answer:</p>
        <input type="text" id="quiz-input" placeholder="e.g. a" autocomplete="off" />
        <button id="quiz-submit">Check Answer</button>
        <div id="quiz-feedback" class="feedback"></div>
      </div>
    </div>

  </div> <!-- end of container -->

  <script src="script.js"></script>
</body>
</html>
